name: Terraform PLAN PRODUCTION

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    types: [checks_requested]

jobs:
  init_plan_production:
    name: Terraform Init and Plan Production
    uses: straumann/dlk-shared-workflows/.github/workflows/tf-dlk-plan.yml@main
    with:
        ENV: 'prod'
        TF_VERSION: '1.5.0'
        ASSUME_ROLE: 'arn:aws:iam::286719176505:role/stg-dlk-devops'
        TF_BACKEND_PATH: './config/prod/backend_prod.conf'
        TF_VARS_PATH: './config/prod/production.tfvars'