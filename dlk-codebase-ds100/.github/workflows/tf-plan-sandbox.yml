name: Terraform PLAN SANDBOX

on:
  pull_request:
    branches: [ "dev" ]
  merge_group:
    types: [checks_requested]

jobs:
  init_plan_sandbox:
    name: Terraform Init and Plan Sandbox
    uses: straumann/dlk-shared-workflows/.github/workflows/tf-dlk-plan.yml@main
    with:
        ENV: 'sbx'
        TF_VERSION: '1.5.0'
        ASSUME_ROLE: 'arn:aws:iam::816247855850:role/stg-dlk-devops'
        TF_BACKEND_PATH: './config/sbx/backend_sbx.conf'
        TF_VARS_PATH: './config/sbx/sandbox.tfvars'